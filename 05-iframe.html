    <h1>O que é um Iframe?</h1>
    <p>iframe significa <strong>inline frame</strong>.</p>
    <p>Ele permite que você <em>incorpore</em> outra página/documento dentro da sua própria página HTML.</p>

    <hr>

    <h2>Criando um iframe básico</h2>
    <iframe src="03-listas.html" frameborder="0" width="500" height="600"></iframe>

    <hr>

    <h2>Explorando outras formas de trabalhar com o iframe</h2>

    <h3>Incorporando o YouTube</h3>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/pfEy4BNeJdw?si=rUyYn9VBuCB0STPO"
        title="Vídeo explicando como fazer um site." frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
