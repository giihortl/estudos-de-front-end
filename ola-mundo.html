<!-- DOCTYPE- serve para informar ao navegador que estamos usando o HTML5 -->
<!DOCTYPE html>
<!-- HTML é a tag principal da pag, tudo relacionado ao HTML fica dentro dela -->
<html lang="pt-br"> 
    <!-- lang/language = é um atributo que serve para configurar/informar o idioma da pagina. por padrãom vem configurado como en (English) mas pode ser alterado para o idioma de quem esta escrevendo o documento HTML -->


<!-- head - essa aera é responsavel por guardar informações sobre a pagina. chamamos de area invisivel pois somente algumas informações ficavam visiveis para o usuario, como por exemplo o nome da pagina, a descrição ou o icone mostrado na aba -->
<head>

    <!-- Esse metatag serve para informar ao navegadir qual conjunto de caracteres a pagina utiliza. Isso garante que as palavras nao fique de forma indevida ou alterada com caracteres sem sentidos e de dificil entendimento -->
    <meta charset="UTF-8">

    <!-- Essa configuração serve para ajudar o navegador a entender como a pagina deve ser exibida de acordo com o tamanho da tela. Em resumo, ajuda a pagina a funcionar corretamente em diferentes tamanhos de tela, -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- title serve para definir o titulo da pagina que aparece na aba do navegador -->
    <title>Document</title>
</head>
<body>
    ola mundo. Este é meu primeiro programa em HTML5.
</body>
</html>
