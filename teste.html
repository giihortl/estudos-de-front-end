<!DOCTYPE html>
<!--
    Declara que este documento utiliza HTML5.
    Não é uma tag, mas uma declaração para o navegador.
-->

<html lang="en">
<!--
    <html> é o elemento raiz da página.
    Todo o código HTML fica dentro dele.

    Atributo:
    lang="en" → informa que o idioma principal da página é inglês.
    Para português do Brasil, podemos usar: lang="pt-BR"
-->

<head>
    <!--
        <head> contém informações e configurações da página
        que normalmente não aparecem diretamente no conteúdo da tela.
    -->

    <meta charset="UTF-8">
    <!--
        <meta> fornece informações/configurações sobre o documento.

        charset="UTF-8" → define a codificação dos caracteres.
        Permite utilizar caracteres como:
        á, ã, ç, é, €, emojis etc.
    -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
        Configura a forma como a página será exibida em diferentes telas,
        principalmente em celulares e tablets.

        name="viewport"
        → informa que estamos configurando a área de visualização da página.

        content="width=device-width"
        → faz a largura da página acompanhar a largura do dispositivo.

        initial-scale=1.0
        → define o zoom inicial como 100%.
    -->

    <title>Document</title>
    <!--
        <title> define o título da página.

        Esse título geralmente aparece na aba do navegador.
    -->

</head>
<!-- Fecha o <head> -->


<body>
    <!--
        <body> é a tag responsavel por construir e mostrar o conteúdo que será exibido na página.

        Por exemplo:
        textos, imagens, botões, vídeos, formulários etc.
    -->

</body>
<!-- Fecha o <body> -->

</html>
<!--
    Fecha o elemento <html>.
    É o final da estrutura do documento HTML.
-->
